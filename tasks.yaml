apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm
spec:
  description: Installs the Node.js dependencies of the project with npm.
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to npm
      type: string
      default: "install"
  steps:
    - name: npm-install
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        npm $(params.args)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine
spec:
  description: Runs the Jasmine unit tests of the project.
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to Jasmine
      type: string
      default: ""
  steps:
    - name: jasmine-test
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        npx jasmine $(params.args)
