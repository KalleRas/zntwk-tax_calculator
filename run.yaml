apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: tax-calculator-run-
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  params:
    - name: repo-url
      value: https://github.com/KalleRas/zntwk-tax_calculator.git
    - name: branch
      value: main
    - name: build-image
      value: image-registry.openshift-image-registry.svc:5000/sn-labs-n2raka00/tax-calculator:latest
  workspaces:
    - name: output
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi